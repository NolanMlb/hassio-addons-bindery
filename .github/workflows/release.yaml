name: Release

on:
  push:
    branches:
      - main
    paths:
      - "bindery/config.yaml"
      - "bindery/CHANGELOG.md"

permissions:
  contents: write

jobs:
  release:
    name: Tag the published version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read the app version
        id: version
        run: |
          version="$(yq -r '.version' bindery/config.yaml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract the changelog entry
        if: steps.check.outputs.exists == 'false'
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## ${VERSION}" '
            $0 == v { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' bindery/CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "No changelog entry found for ${VERSION}." > notes.md
          fi

      - name: Create the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${TAG}" \
            --title "Bindery ${VERSION}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}"
